name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  moonbit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show MoonBit version
        run: moon version --all

      - name: Check formatting
        run: moon fmt --check

      - name: Generate interface
        run: moon info

      - name: Strict check
        run: moon check --deny-warn

      - name: Build
        run: moon build

      - name: Test
        run: moon test

      - name: Run baseline example
        run: moon run examples/baseline

      - name: Run smoothing example
        run: moon run examples/smoothing

      - name: Run seasonal example
        run: moon run examples/seasonal

      - name: Run decomposition example
        run: moon run examples/decomposition

      - name: Run backtest example
        run: moon run examples/backtest

      - name: Audit source
        shell: pwsh
        run: ./scripts/source-audit.ps1
